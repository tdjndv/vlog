<section class="auth-wrap">
  <h2>Sign up</h2>

  @if (formError()) {
  <p class="error">{{ formError() }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Username
      <input type="text" formControlName="username" autocomplete="username" />
      @if (form.controls.username.touched && form.controls.username.invalid) {
      <small class="error">3–50 characters, letters, numbers and underscores only</small>
      }
      @if (serverError('username')) {
      <small class="error">{{ serverError('username') }}</small>
      }
    </label>

    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
      <small class="error">Enter a valid email address</small>
      }
      @if (serverError('email')) {
      <small class="error">{{ serverError('email') }}</small>
      }
    </label>

    <label>
      Password
      <input type="password" formControlName="password" autocomplete="new-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
      <small class="error">At least 8 characters</small>
      }
      @if (serverError('password')) {
      <small class="error">{{ serverError('password') }}</small>
      }
    </label>

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Creating…' : 'Sign up' }}
    </button>
  </form>

  <p class="alt">Already have an account? <a routerLink="/login">Log in</a></p>
</section>
